name: CloudCart Frontend Production Deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudcart-frontend-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1

jobs:
  build-and-deploy:
    name: Build and Deploy Angular Frontend
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Scan source, dependencies, secrets and configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: CloudCartFrontendDeployment
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set immutable image tag
        run: |
          IMAGE_TAG="prod-${GITHUB_SHA::8}-${GITHUB_RUN_ID}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./application/frontend
          file: ./application/frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ vars.ECR_REGISTRY }}/frontend:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.ECR_REGISTRY }}/frontend:${{ env.IMAGE_TAG }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Checkout Kubernetes repository
        uses: actions/checkout@v4
        with:
          repository: aleenaeantony/cloudcart-k8s
          token: ${{ secrets.K8S_REPO_TOKEN }}
          ref: main
          path: cloudcart-k8s

      - name: Update frontend Kubernetes deployment
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="cloudcart-k8s/production/frontend/deployment.yaml"

          python3 - "$MANIFEST" "$ECR_REGISTRY" "$IMAGE_TAG" <<'PY'
          import re
          import sys
          from pathlib import Path

          manifest = Path(sys.argv[1])
          registry, tag = sys.argv[2:]

          if not manifest.is_file():
              raise SystemExit(f"Manifest not found: {manifest}")

          image = f"{registry}/frontend:{tag}"
          content = manifest.read_text()

          updated, count = re.subn(
              r"(?m)^(\s*image:\s*).*$",
              lambda match: match.group(1) + image,
              content,
              count=1
          )

          if count != 1:
              raise SystemExit("Expected exactly one container image entry")

          manifest.write_text(updated)
          print(f"Updated frontend image to {image}")
          PY

      - name: Commit and push Kubernetes manifest
        working-directory: cloudcart-k8s
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add production/frontend/deployment.yaml

          if git diff --cached --quiet; then
            echo "No manifest changes detected."
            exit 0
          fi

          git commit -m "deploy: update frontend to ${IMAGE_TAG}"
          git push origin main
