apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudcart-config
  namespace: cloudcart
data:
  SPRING_PROFILES_ACTIVE: production
  KAFKA_BOOTSTRAP_SERVERS: kafka.cloudcart.svc.cluster.local:9092
  SPRING_DATA_REDIS_HOST: redis.assets.svc.cluster.local
  SPRING_DATA_REDIS_PORT: "6379"
  FRONTEND_ORIGIN: "*"
  INVENTORY_SERVICE_URL: http://inventory-service:8083
  PRODUCT_SERVICE_URL: http://product-service:8082
